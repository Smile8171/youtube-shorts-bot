name: Automated YouTube Shorts

on:
  schedule:
    - cron: '0 7,14,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install google-genai moviepy edge-tts Pillow numpy google-auth-oauthlib google-api-python-client requests

      - name: Run Script with AI Self-Healing
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo "Running main.py (Attempt 1)..."
          if ! python main.py 2> error.log; then
            echo "Error detected! Launching Gemini Auto-Fixer..."
            cat error.log
            python auto_fixer.py
            
            echo "Committing AI fix back to repository..."
            git config user.name "Gemini Auto-Fixer Bot"
            git config user.email "actions@github.com"
            git add main.py
            git commit -m "AI Auto-Fix: Repaired main.py after crash" || true
            git push || true
            
            echo "Re-running repaired main.py (Attempt 2)..."
            python main.py
          fi
